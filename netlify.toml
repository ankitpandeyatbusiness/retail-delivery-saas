# Netlify: builds the customer website from the /mobile folder (docs/web-hosting.md).
# The settings are here so they do not depend on what is typed in the Netlify dashboard (a wrong "Publish directory" there is what shows "Page not found").
# Still set these in Netlify > Site configuration > Environment variables:
#   WEB_API_URL  = https://<your-render-app>.onrender.com/api        (https, with /api at the end)
#   MEDIA_CDN_URL = the public media address (the same as in mobile/eas.json)
#   APP_TENANT   = the shop slug this site shows, for example savera
#   EXPO_PUBLIC_GOOGLE_MAPS_WEB_KEY = the browser maps key (optional, for maps)
[build]
  base = "mobile"
  command = "npm install && npm run build:web"
  publish = "dist-web"

[build.environment]
  NODE_VERSION = "22"

# The website has its own addresses (/home, /cart, /orders/123 ...): any address that is not a real file opens the app, so a refresh or a shared link works.
# (Real files, such as the scripts and icons, are still served as they are.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The page and the service worker are never cached, so a new deploy shows at the next visit; the numbered files are cached for a year.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
